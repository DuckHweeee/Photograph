# XcodeGen spec — the single source of truth for the Xcode project.
# Generate the project with:  xcodegen generate
# photograph.xcodeproj is generated and git-ignored; never edit it by hand.

name: photograph

options:
  bundleIdPrefix: hwee
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  photograph:
    type: application
    platform: iOS
    sources:
      - path: photograph
      - path: Shared
    info:
      path: photograph/Info.plist
      properties:
        CFBundleDisplayName: Photograph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: photograph/photograph.entitlements
      properties:
        com.apple.security.application-groups:
          - group.hwee.photograph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hwee.photograph
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PhotographWidget
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    scheme:
      testTargets:
        - PhotographTests

  PhotographWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PhotographWidget
      - path: Shared
    info:
      path: PhotographWidget/Info.plist
      properties:
        CFBundleDisplayName: Photograph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PhotographWidget/PhotographWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.hwee.photograph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hwee.photograph.widget

  PhotographTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotographTests
    dependencies:
      - target: photograph
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/photograph.app/photograph
        BUNDLE_LOADER: $(TEST_HOST)
